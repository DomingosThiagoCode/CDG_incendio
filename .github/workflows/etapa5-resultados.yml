name: Etapa 5 - gerar e versionar produtos

on:
  push:
    branches: [feat/etapa5-analise-integrada]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-auditoria.txt
      - name: Instalar dependencias e executar testes da Etapa 5
        run: |
          python -m pip install -r requirements-auditoria.txt
          python -m unittest discover -s tests -p "test_integrar_etapa5.py" -v
      - name: Gerar serie, mapas, graficos e relatorio
        run: |
          python scripts/integrar_etapa5.py --id 24340828 --saida resultados/etapa5
          cp resultados/etapa5/relatorio_interpretativo_24340828.md docs/analise_integrada_24340828.md
      - name: Verificar entregas obrigatorias
        run: |
          test -s resultados/etapa5/resumo_etapa5_24340828.json
          test -s resultados/etapa5/transicoes_integradas_24340828.csv
          test -s resultados/etapa5/mapa_2020-09-11.png
          test -s docs/analise_integrada_24340828.md
      - name: Publicar resultados versionados na branch de trabalho
        if: github.ref_name == 'feat/etapa5-analise-integrada'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resultados/etapa5/ docs/analise_integrada_24340828.md
          if ! git diff --cached --quiet; then
            git commit -m "data: gera resultados integrados da etapa 5 [skip ci]"
            git push origin HEAD:feat/etapa5-analise-integrada
          fi
      - name: Disponibilizar resultados em artefato
        uses: actions/upload-artifact@v4
        with:
          name: etapa5-pantanal-24340828
          path: resultados/etapa5/
          retention-days: 90
