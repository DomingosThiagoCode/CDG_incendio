name: Testes Python geoespaciais
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-auditoria.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements-auditoria.txt
      - name: Regressao analitica e real
        run: python -m unittest discover -s tests -v
