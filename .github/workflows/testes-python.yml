name: Testes Python geoespaciais
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-auditoria.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements-auditoria.txt
      - name: Regressao analitica e real
        run: python -m unittest discover -s tests -v
      - name: Gerar produtos consolidados TR x IGT
        run: |
          python scripts/consolidar_tr_igt.py \
            dados/estudo_caso_24340828/P1_componentes_24340828.geojson \
            dados/estudo_caso_24340828/P2_regiao_movel_24340828.geojson \
            --saida saida_etapa4
      - name: Publicar produtos para consulta
        uses: actions/upload-artifact@v4
        with:
          name: etapa4-tr-igt-24340828
          path: saida_etapa4/
          retention-days: 90
